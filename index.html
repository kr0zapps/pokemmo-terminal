<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokÃ©MMO Terminal</title>
    
    <!-- Scripts CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.4.0/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/pokemon-solid" rel="stylesheet">
    
    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        os: {
                            bg: '#090A0F',
                            panel: '#13151F',
                            border: '#262A3D',
                            red: '#F93822',
                            green: '#10B981',
                            blue: '#3B82F6',
                            text: '#EDEDED',
                            muted: '#82889E'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="font-sans antialiased min-h-screen flex flex-col selection:bg-os-red selection:text-white">

    <!-- HEADER / NAVIGATION -->
    <header class="border-b border-os-border bg-os-panel">
        <div class="max-w-7xl mx-auto px-6">
            <div class="flex flex-col md:flex-row justify-between items-center py-4 gap-4">
                <div class="flex items-center gap-3">
                    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png" alt="Pokeball" class="w-5 h-5 animate-spin-slow pokemon-sprite">
                    <span class="text-xl font-pokemon tracking-widest uppercase mt-1">PokÃ©MMO Terminal</span>
                    <span class="text-xs font-mono text-os-muted ml-2 mt-2">v3.0</span>
                </div>
                <div class="flex flex-wrap items-center justify-between w-full md:w-auto gap-3">
                    <nav class="flex gap-2">
                        <button id="nav-gyms" onclick="switchTab('gyms')" class="tab-btn">Gym Reruns</button>
                        <button id="nav-berries" onclick="switchTab('berries')" class="tab-btn">Cultivo de Bayas</button>
                        <button id="nav-pokedex" onclick="switchTab('pokedex')" class="tab-btn">PokÃ©dex Optimizer</button>
                        <button id="nav-breeding" onclick="switchTab('breeding')" class="tab-btn">Crianza (Breeding)</button>
                    </nav>
                    <div id="auth-area">
                        <!-- User email, logout, and sync badge injected here -->
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main id="app-main" class="flex-grow max-w-7xl mx-auto px-6 py-8 w-full relative">
        <!-- Views are injected here by app.js -->
    </main>

    <!-- GLOBAL TOAST NOTIFICATIONS -->
    <div id="app-toast" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

    <!-- ENTRY POINT -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
